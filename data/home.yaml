page_title:
  title: "Ciencia ciudadana para investigar y controlar mosquitos transmisores de enfermedades"
  subtitle: "Unimos la ciudadanía, científicos y gestores de salud pública y medio ambiente para luchar contra el mosquito tigre y el mosquito de la fiebre amarilla, vectores de Zika, Dengue y Chikungunya"
intro:
  image: "/uploads/2025/09/6-1024x1024.png"
  highlight:
    text_top: "Descarga la app y avisa si ves mosquito tigre, mosquito común o cualquier otra de las especies que buscamos"
    text_bottom: "o consulta el mapa para ver los hallazgos de todo el mundo a tiempo real"
    cta_text: "Accede al mapa"
    cta_url: "https://map.mosquitoalert.com/es"
    stores:
      - name: "App Store"
        icon: "/uploads/2017/01/app-store-2.png"
        url: "https://apps.apple.com/app/id1030575256"
      - name: "Google Play"
        icon: "/uploads/2017/01/google-play.png"
        url: "https://play.google.com/store/apps/details?id=com.csic.mosquitoalert"
objectives:
  title: "OBJETIVOS"
  subtitle: "Ciencia, gestión y participación ciudadana contra un problema global"
  description: "Sumamos esfuerzos para detectar y controlar la expansión del mosquito tigre, el mosquito de la fiebre amarilla y otras especies invasoras."
  cta_text: "Descubre el proyecto"
  cta_url: "/que-es-mosquito-alert"
  items:
    - title: "Acercamos la gestión pública a la ciudadanía"
      text: "Hacemos que la ciencia ciudadana sea útil para las entidades responsables del seguimiento y control del mosquito tigre y del mosquito de la fiebre amarilla."
      image: "/uploads/2025/09/1-1-800x600.jpg"
      url: "/ambitos-de-actuacion/seguimiento-y-control/"
      link_label: "Ir a 'Seguimiento y control'"
    - title: "Hacemos ciencia de calidad"
      text: "La participación ciudadana complementa el trabajo científico de muchas universidades y expertos."
      image: "/uploads/2025/09/2-1-1-800x600.jpg"
      url: "/ambitos-de-actuacion/ciencia/"
      link_label: "Ir a 'Ciencia'"
    - title: "Utilizamos una metodología de futuro"
      text: "Hemos revolucionado el sistema de seguimiento y control con nuevas tecnologías que permiten obtener datos de forma masiva."
      image: "/uploads/2025/09/Untitled-design-4-800x600.jpg"
      url: "/ambitos-de-actuacion/participacion-ciudadana/"
      link_label: "Ir a 'Participación ciudadana'"
    - title: "Sensibilizamos a la ciudadanía"
      text: "Involucramos, educamos y concienciamos a la ciudadanía para solucionar este problema de salud pública global."
      image: "/uploads/2025/09/4-1-1-800x600.jpg"
      url: "/ambitos-de-actuacion/educacion/"
      link_label: "Ir a 'Educación'"
