{{ $data := .Site.Data.home.partners }}
<section class="home-section home-partners">
  <div class="wrap">
    {{ if or $data.intro_title $data.footer_badges }}
    <div class="partner-intro">
      {{ with $data.intro_title }}<h3>{{ . }}</h3>{{ end }}
      {{ with $data.footer_badges }}
      <div class="partner-badges">
        {{ range . }}
        <img src="{{ .image }}" alt="{{ .name }}" />
        {{ end }}
      </div>
      {{ end }}
    </div>
    {{ end }}
    <div class="section-intro">
      <h2>{{ $data.title }}</h2>
    </div>
    <div class="partner-logos">
      {{ range $data.logos }}
      <a href="{{ .url }}" target="_blank" rel="noopener">
        <img src="{{ .image }}" alt="{{ .name }}" />
      </a>
      {{ end }}
    </div>
  </div>
</section>
