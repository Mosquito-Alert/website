{{ $title := .Site.Data.home.page_title }}
{{ $intro := .Site.Data.home.intro }}

<section class="page-title-bar">
  <div class="wrap">
    <h1>{{ $title.title }}</h1>
    <p>{{ $title.subtitle }}</p>
  </div>
</section>

<section class="home-intro">
  <div class="wrap">
    <div class="intro-image">
      <img src="{{ $intro.image }}" alt="Ilustración del proyecto Mosquito Alert" />
    </div>
    <aside class="intro-highlight">
      <p class="intro-top">{{ $intro.highlight.text_top }}</p>
      <div class="store-buttons">
        {{ range $intro.highlight.stores }}
        <a href="{{ .url }}" class="store-badge" target="_blank" rel="noopener">
          <img src="{{ .icon }}" alt="{{ .name }}" />
        </a>
        {{ end }}
      </div>
      <p class="intro-bottom">{{ $intro.highlight.text_bottom }}</p>
      <a class="btn btn-map" href="{{ $intro.highlight.cta_url }}">{{ $intro.highlight.cta_text }}</a>
    </aside>
  </div>
</section>
