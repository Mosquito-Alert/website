{{ $data := .Site.Data.home.contact }}
{{ if $data }}
<section class="home-section home-contact">
  <div class="wrap">
    <div class="contact-card">
      <h2>{{ $data.title }}</h2>
      {{ with $data.description }}<p>{{ . }}</p>{{ end }}
      {{ with $data.button_url }}
      <a class="btn btn-highlight" href="{{ . }}">{{ $data.button_text }}</a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
